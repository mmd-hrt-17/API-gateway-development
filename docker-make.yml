services:
  service1:
    build: ./services/service1
    container_name: service1
    restart: always
    expose:
      - "8001"
    ports:
      - "8001:8001"
    networks:
      - ecommerce-net

  service3:
    build: ./services/service3
    container_name: service3
    restart: always
    expose:
      - "8003"
    ports:
      - "8003:8003"

    networks:
      - ecommerce-net


networks:
  ecommerce-net:
    driver: bridge
