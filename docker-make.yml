services:
  etcd:
    image: bitnamilegacy/etcd:3.5
    container_name: apisix-etcd
    restart: always
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    volumes:
      - etcd_data:/bitnami/etcd
    networks:
      - ecommerce-net

  apisix:
    image: apache/apisix:latest
    container_name: apisix-gateway
    restart: always
    volumes:
      - ./apisix_conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    depends_on:
      - etcd
    ports:
      - "9080:9080/tcp"
      - "9180:9180/tcp"
    networks:
      - ecommerce-net


  service1:
    build: ./services/service1
    container_name: service1
    restart: always
    expose:
      - "8001"
    ports:
      - "8001:8001"
    networks:
      - ecommerce-net

  service3:
    build: ./services/service3
    container_name: service3
    restart: always
    expose:
      - "8003"
    ports:
      - "8003:8003"

    networks:
      - ecommerce-net


networks:
  ecommerce-net:
    driver: bridge

volumes:
  etcd_data:
